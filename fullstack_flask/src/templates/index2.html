<!doctype html>
<html lang="en" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="chatbot">
    <title>Large Language Model Demo</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
        crossorigin="anonymous"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css"
        integrity="sha256-4RctOgogjPAdwGbwq+rxfwAmSpZhWaafcZR9btzUk18="
        crossorigin="anonymous"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootswatch@5.2.3/dist/cosmo/bootstrap.min.css"
        integrity="sha256-axRDISYf7Hht1KhcMnfDV2nq7hD/8Q9Rxa0YlW/o3NU="
        crossorigin="anonymous"
    >
    <link href="/static/styles.css" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="h-100 mh-100 d-flex flex-column overflow-hidden justify-content-start">
        <h1 class="display-5">Welcome to {{demo_name}} Demo!</h1>

        <!-- MESSAGES CONTAINER -->
        <div id="messages" class="px-4 pb-4 pt-2 flex-grow-1 overflow-y-auto overflow-x-hidden align-items-stretch">
            <!-- USER MESSAGE TEMPLATE -->
            <template id="message-template-user">
                <div class="toast-container position-static w-100 d-flex flex-column align-items-stretch">
                    <div class="toast fade show w-75 rounded-3 align-self-end">
                        <div class="toast-header text-light background-user">
                            <i class="bi bi-person me-1" aria-hidden="true"></i>
                            <strong class="me-auto text-capitalize">
                                You
                            </strong>
                        </div>
                        <div class="toast-body message-content">
                            <!-- The user message will be populated here -->
                        </div>
                    </div>
                </div>
            </template>

            <!-- ASSISTANT MESSAGE TEMPLATE -->
            <template id="message-template-assistant">
                <div class="toast-container position-static w-100 d-flex flex-column align-items-stretch">
                    <div class="toast fade show w-75 rounded-3 align-self-start">
                        <div class="toast-header text-light background-assistant">
                            <i class="bi bi-robot me-1" aria-hidden="true"></i>
                            <strong class="me-auto text-capitalize">
                                Assistant
                            </strong>
                        </div>
                        <div class="toast-body message-content">
                            <em class="typing-indicator">Typing...</em>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- CHAT AREA with TWO side-by-side inputs and a SINGLE submit button -->
        <div id="chat-area" class="px-4 py-2 background-user">
            <form id="chat-form" class="row gx-2 gy-2 align-items-end">
                <!-- Left Input -->
                <div class="col-5">
                    <label for="leftInput" class="visually-hidden">Left Input</label>
                    <input
                        id="targetPaper"
                        name="leftInput"
                        type="text"
                        class="form-control form-control-sm"
                        placeholder="Target paper name"
                        aria-label="Left Input"
                        required
                    >
                </div>

                <!-- Right Input -->
                <div class="col-5">
                    <label for="rightInput" class="visually-hidden">Right Input</label>
                    <input
                        id="validatePaper"
                        name="rightInput"
                        type="text"
                        class="form-control form-control-sm"
                        placeholder="Validate paper name"
                        aria-label="Right Input"
                        required
                    >
                </div>

                <!-- Single Submit Button -->
                <div class="col-2 d-flex justify-content-end">
                    <button
                        type="submit"
                        class="btn btn-outline-light btn-sm"
                    >
                        Send <i class="bi bi-send-fill" aria-hidden="true"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Optional scripts for Showdown (Markdown) and NDJSON streaming if needed -->
    <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ndjson-readablestream@1.0.1/dist/ndjson-readablestream.umd.js"></script>
    <script>
        // Grab references
        const chatForm = document.getElementById("chat-form");
        const leftInput = document.getElementById("targetPaper");
        const rightInput = document.getElementById("validatePaper");
        const messagesContainer = document.getElementById("messages");

        const userTemplate = document.getElementById("message-template-user");
        const assistantTemplate = document.getElementById("message-template-assistant");

        // If you want Markdown rendering, you can use showdown
        const converter = new showdown.Converter();

        // Basic HTML escaping to prevent potential XSS
        function escapeHtml(str) {
          return str
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        // Listen for the single form submit
        chatForm.addEventListener("submit", async function(e) {
            e.preventDefault();

            // Get both input values
            const leftVal = leftInput.value.trim();
            const rightVal = rightInput.value.trim();

            if (!leftVal || !rightVal) {
                alert("Please fill both inputs before sending!");
                return;
            }

            // Reset the fields so they stay but become empty
            leftInput.value = "";
            rightInput.value = "";

            // 1. Display user's message (using user template)
            // Combine the two inputs in a single user message
            const userClone = userTemplate.content.cloneNode(true);
            const userMessageDiv = userClone.querySelector(".message-content");
            userMessageDiv.innerText = `Left: ${leftVal}\nRight: ${rightVal}`;
            messagesContainer.appendChild(userClone);

            // 2. Display assistant area (assistant template)
            const assistantClone = assistantTemplate.content.cloneNode(true);
            let assistMessageDiv = assistantClone.querySelector(".message-content");
            messagesContainer.appendChild(assistantClone);

            //Simulate or handle a server response here, e.g.:
            try {
                const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ left: leftVal, right: rightVal })
                });

                if (!response.ok) {
                    assistMessageDiv.innerHTML = `<span class="text-danger">Error: ${response.status} ${response.statusText}</span>`;
                    return;
                }

                let answer = "";
                // Use readNDJSONStream to parse the streamed NDJSON
                for await (const event of readNDJSONStream(response.body)) {
                // 'event' is expected to be an object, e.g. { token: "..."}
                    if (event.token) {
                        // Remove "Typing..." the first time we receive a token
                        if (answer === "") {
                            assistMessageDiv.innerHTML = "";
                        }
                        // Accumulate the token
                        answer += event.token;
                        // Render it (optionally using Markdown)
                        const safeText = escapeHtml(answer);
                        assistMessageDiv.innerHTML = converter.makeHtml(safeText);
                        // Ensure the latest content is visible
                        assistMessageDiv.scrollIntoView();
                    }
                }
            } catch (err) {
                // Handle fetch or network errors
                assistMessageDiv.innerHTML = `<span class="text-danger">Request failed: ${escapeHtml(err.message)}</span>`;
            }
        });
    </script>
</body>
</html>
